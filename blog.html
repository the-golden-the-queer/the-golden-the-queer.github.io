<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文章專區 | 性別狗勾吠叫中！</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="alternate" type="application/rss+xml" title="RSS 訂閱" href="feed.xml" />
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo-link">
      <img src="images/性別狗勾_logo.png" alt="性別狗勾吠叫中！" class="logo-img">
    </a>
    <nav>
      <a href="game.html" target="_blank" rel="noopener noreferrer">情境遊戲</a>
      <a href="blog.html" class="active">文章專區</a>
      <a href="about.html">關於狗勾</a>
    </nav>
  </header>

  <main class="container">
    <div class="section-block">
      <h2>網誌文章</h2>
      <!-- 文章卡片由下方的 JavaScript 自動從 posts 資料夾產生 -->
      <div class="card-grid" id="post-list">
        <p class="status-msg">文章載入中…</p>
      </div>
    </div>

    <div id="rss" class="section-block rss-section">
      <h2>訂閱 RSS 推播更新（建置中，請勿使用）</h2>
      <p>透過 RSS 閱讀器訂閱，第一時間接收最新文章與遊戲更新通知！</p>
      
      <div class="rss-actions">
        <div class="input-group">
          <input type="text" id="rss-url" value="https://your-domain.com/feed.xml" readonly />
          <button onclick="copyRSSUrl()">複製 RSS 網址</button>
        </div>
        <button id="notify-btn" class="secondary-btn" onclick="requestNotification()">開啟瀏覽器更新推播通知</button>
      </div>
      <p id="rss-status" class="status-msg"></p>
    </div>
  </main>

  <footer>
    <p>© 2026 性別狗勾吠叫中！ Powered by HTML, CSS & JavaScript.</p>
  </footer>

  <script>
    /* ===== 網誌文章自動列表設定 ===== */
    const POSTS_CONFIG = {
      owner: "the-golden-the-queer",                 // GitHub 帳號
      repo: "the-golden-the-queer.github.io",        // 存放網站的 repo 名稱
      folder: "posts",                               // 文章資料夾
      newestFirst: true,                             // true：檔名排序越後面的越先顯示
      excerptLength: 80                              // 預覽內文字數
    };

    // 取得 posts 資料夾裡的所有 .html 檔名
    async function listPostFiles() {
      const { owner, repo, folder, newestFirst } = POSTS_CONFIG;
      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`);
        if (!res.ok) throw new Error("GitHub API " + res.status);
        const items = await res.json();
        const names = items
          .filter(item => item.type === "file" && item.name.endsWith(".html"))
          .map(item => item.name)
          .sort((a, b) => a.localeCompare(b, "zh-Hant", { numeric: true }));
        return newestFirst ? names.reverse() : names;
      } catch (err) {
        // 備援：若 GitHub API 無法使用，改讀 posts/posts.json（內容為檔名陣列，依顯示順序排列）
        const res = await fetch(`${folder}/posts.json`);
        if (!res.ok) throw err;
        return await res.json();
      }
    }

    // 讀取單篇文章，抓出標題、分類與預覽內文
    async function loadPostPreview(fileName) {
      const url = `${POSTS_CONFIG.folder}/${fileName}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");

      const title = (doc.querySelector("h1")?.textContent || doc.title || fileName).trim();
      const tag = doc.querySelector('meta[name="category"]')?.content?.trim() || "";

      let excerpt = doc.querySelector('meta[name="description"]')?.content?.trim() || "";
      if (!excerpt) {
        const scope = doc.querySelector("article") || doc.querySelector("main") || doc.body;
        const firstP = [...scope.querySelectorAll("p")].find(p => p.textContent.trim());
        excerpt = firstP ? firstP.textContent.trim().replace(/\s+/g, " ") : "";
      }
      if (excerpt.length > POSTS_CONFIG.excerptLength) {
        excerpt = excerpt.slice(0, POSTS_CONFIG.excerptLength) + "...";
      }
      return { url, title, tag, excerpt };
    }

    // 產生文章卡片
    function createPostCard(post) {
      const card = document.createElement("article");
      card.className = "card";

      if (post.tag) {
        const tagEl = document.createElement("div");
        tagEl.className = "card-tag";
        tagEl.textContent = post.tag;
        card.appendChild(tagEl);
      }

      const h3 = document.createElement("h3");
      h3.textContent = post.title;
      card.appendChild(h3);

      const p = document.createElement("p");
      p.textContent = post.excerpt;
      card.appendChild(p);

      const link = document.createElement("a");
      link.href = post.url;
      link.className = "read-more";
      link.textContent = "閱讀全文 →";
      card.appendChild(link);

      return card;
    }

    async function renderPostList() {
      const listEl = document.getElementById("post-list");
      try {
        const files = await listPostFiles();
        const posts = (await Promise.all(files.map(loadPostPreview))).filter(Boolean);
        listEl.innerHTML = "";
        if (posts.length === 0) {
          listEl.innerHTML = '<p class="status-msg">目前還沒有文章喔！</p>';
          return;
        }
        posts.forEach(post => listEl.appendChild(createPostCard(post)));
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<p class="status-msg">文章列表載入失敗，請稍後再試。</p>';
      }
    }

    renderPostList();

    /* ===== RSS 相關功能 ===== */
    function copyRSSUrl() {
      const rssInput = document.getElementById("rss-url");
      rssInput.select();
      rssInput.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(rssInput.value)
        .then(() => {
          showStatus("RSS 網址已複製到剪貼簿！");
        })
        .catch(() => {
          showStatus("複製失敗，請手動複製網址。");
        });
    }

    function requestNotification() {
      if (!("Notification" in window)) {
        showStatus("您的瀏覽器不支援 Web Notification 功能。");
        return;
      }

      Notification.requestPermission().then((permission) => {
        if (permission === "granted") {
          showStatus("已成功開啟瀏覽器通知！");
          new Notification("感謝訂閱！", {
            body: "當有最新文章或遊戲更新時，您將收到這類推播通知。"
          });
        } else {
          showStatus("推播通知權限已被拒絕。");
        }
      });
    }

    function showStatus(message) {
      const statusEl = document.getElementById("rss-status");
      if (!statusEl) return;
      statusEl.innerText = message;
      setTimeout(() => {
        statusEl.innerText = "";
      }, 4000);
    }
  </script>
</body>
</html>
